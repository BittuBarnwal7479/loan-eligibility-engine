[project]
name = "loan-eligibility-engine"
version = "1.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: requires a PostgreSQL database (TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S608", "E501"]  # line length is handled by `ruff format`; long SQL/HTML strings stay intact

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
