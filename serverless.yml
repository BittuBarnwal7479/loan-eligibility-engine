# AWS deployment (NOT deployed by the author - see docs/AWS_DEPLOYMENT.md before running).
#
# Creates: HTTP API + API Lambda, S3-triggered CSV Lambda, migration Lambda, the
# S3 -> Lambda invoke permission, and a least-privilege SES send policy for n8n.
# Reuses (created in the console, NOT managed by this stack): VPC/subnets, the Lambda and
# RDS security groups, the S3 gateway VPC endpoint, the RDS PostgreSQL instance and the
# upload bucket. The bucket's event notification, CORS, lifecycle and TLS-only policy are
# configured in the S3 console (docs/AWS_DEPLOYMENT.md). No NAT gateway, on purpose.
# Does NOT create: the n8n host, SES identities, or SSM parameters.
#
# Required SSM parameters (create once per stage, SecureString where noted):
#   /loan-engine/<stage>/db-password            SecureString, password of dbUser; URL-safe characters only
#   /loan-engine/<stage>/internal-api-token     SecureString
#   /loan-engine/<stage>/n8n-webhook-token      SecureString
#   /loan-engine/<stage>/n8n-matching-webhook-url  String, e.g. http://10.0.1.25:5678/webhook/loan-matching
#   /loan-engine/<stage>/notification-test-recipient String, an inbox you control (SES-verified while in sandbox)
#
# Deploy:  npx serverless deploy --stage dev --param="frontendOrigin=http://localhost:5173" \
#            --param="sesFromAddress=verified-sender@yourdomain" --param="n8nSecurityGroupId=sg-..."
# Remove:  npx serverless remove --stage dev   (leaves the reused bucket, RDS and security groups untouched)

service: loan-eligibility-engine
frameworkVersion: "3"

plugins:
  - serverless-python-requirements

params:
  default:
    frontendOrigin: http://localhost:5173
    n8nSecurityGroupId: ""
    sesFromAddress: ""
    # Existing resources in ap-southeast-2 (override with --param if they change).
    subnetIds: subnet-0989f4a5aeb932e4c,subnet-0a1b2ca704aa0bf06  # 2a + 2b; their route table has the S3 gateway endpoint
    lambdaSecurityGroupId: sg-0159bd3bd8ad94e18  # the RDS SG (sg-0ff40905231dc8c9a) allows 5432 from this group
    uploadBucket: loan-eligibility-engine
    dbHost: database-1.cr8qe4miqt96.ap-southeast-2.rds.amazonaws.com
    dbUser: postgres   # RDS master username (RDS console -> Configuration)
    dbName: postgres   # always exists on RDS PostgreSQL; migrations create their tables in its public schema

custom:
  stage: ${sls:stage}
  bucketName: ${param:uploadBucket}
  ssmPrefix: /loan-engine/${sls:stage}
  pythonRequirements:
    fileName: backend/requirements.txt
    dockerizePip: non-linux       # psycopg binary wheels must be built for Amazon Linux
    slim: true
    noDeploy:
      - boto3
      - botocore

provider:
  name: aws
  runtime: python3.12
  architecture: x86_64
  region: 'ap-southeast-2'
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 29
  logRetentionInDays: 14
  tags:
    project: loan-eligibility-engine
    stage: ${sls:stage}
  httpApi:
    cors:
      allowedOrigins:
        - ${param:frontendOrigin}
      allowedMethods: [GET, POST]
      allowedHeaders: [Content-Type]
      maxAge: 600
  vpc:
    securityGroupIds:
      - ${param:lambdaSecurityGroupId}
    subnetIds: !Split [",", "${param:subnetIds}"]
  environment:
    APP_ENV: ${sls:stage}
    PYTHONPATH: /var/task/backend:/var/task
    LOG_LEVEL: INFO
    STORAGE_MODE: s3
    UPLOAD_BUCKET: ${self:custom.bucketName}
    UPLOAD_URL_TTL_SECONDS: "300"
    MAX_UPLOAD_BYTES: "10485760"
    # Resolved from SSM at deploy time; Lambda encrypts environment variables at rest with KMS.
    DATABASE_URL: !Join
      - ""
      - - "postgresql://${param:dbUser}:"
        - ${ssm:${self:custom.ssmPrefix}/db-password}
        - "@${param:dbHost}:5432/${param:dbName}?sslmode=require"
    INTERNAL_API_TOKEN: ${ssm:${self:custom.ssmPrefix}/internal-api-token}
    N8N_WEBHOOK_TOKEN: ${ssm:${self:custom.ssmPrefix}/n8n-webhook-token}
    N8N_MATCHING_WEBHOOK_URL: ${ssm:${self:custom.ssmPrefix}/n8n-matching-webhook-url}
    CORS_ORIGINS: ${param:frontendOrigin}
    NOTIFICATION_MODE: ses
    NOTIFICATION_FROM_EMAIL: ${param:sesFromAddress}
    # NOTIFICATION_TEST_RECIPIENT is required for ses mode; set it per stage:
    NOTIFICATION_TEST_RECIPIENT: ${ssm:${self:custom.ssmPrefix}/notification-test-recipient}
    LLM_ENABLED: "false"
  # The upload bucket already exists and is not owned by this stack, so its public-access block,
  # SSE-S3 default encryption, 7-day uploads/ lifecycle, CORS and TLS-only policy are set in the
  # S3 console (docs/AWS_DEPLOYMENT.md) instead of here.
  iam:
    role:
      statements:
        # Read uploaded CSVs; PutObject is needed only so presigned POST policies signed by this role are valid.
        - Effect: Allow
          Action: [s3:GetObject, s3:PutObject]
          Resource: arn:aws:s3:::${self:custom.bucketName}/uploads/*

package:
  individually: false
  patterns:
    - "!**"
    - backend/app/**
    - backend/handlers/**
    - backend/migrations/**
    - backend/config/**
    - backend/seeds/**
    - "!**/__pycache__/**"

functions:
  api:
    handler: backend/handlers/api.handler
    description: FastAPI app (public upload endpoints + token-protected /internal endpoints for n8n)
    events:
      - httpApi: { method: GET, path: "/health" }
      - httpApi: { method: POST, path: "/api/uploads" }
      - httpApi: { method: GET, path: "/api/uploads/{batchId}" }
      - httpApi: { method: GET, path: "/api/csv-template" }
      - httpApi: { method: ANY, path: "/internal/{proxy+}" }

  processCsv:
    handler: backend/handlers/process_csv.handler
    description: S3 ObjectCreated -> validate CSV and import into PostgreSQL, then trigger n8n Workflow B
    timeout: 300
    memorySize: 1024
    maximumRetryAttempts: 2
    # No `s3` event: the bucket is not managed by this stack, and `existing: true` would deploy a
    # Serverless custom-resource Lambda on the deprecated nodejs18.x runtime. Add the bucket's
    # ObjectCreated notification (prefix uploads/, suffix .csv) in the S3 console;
    # ProcessCsvS3InvokePermission below allows that bucket to invoke this function.

  migrate:
    handler: backend/handlers/migrate.handler
    description: Apply SQL migrations (invoke manually after deploy)
    timeout: 120

resources:
  Conditions:
    HasN8nSecurityGroup: !Not [!Equals ["${param:n8nSecurityGroupId}", ""]]
    HasSesFromAddress: !Not [!Equals ["${param:sesFromAddress}", ""]]

  Resources:
    ProcessCsvS3InvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !GetAtt ProcessCsvLambdaFunction.Arn
        Action: lambda:InvokeFunction
        Principal: s3.amazonaws.com
        SourceArn: arn:aws:s3:::${self:custom.bucketName}
        SourceAccount: !Ref AWS::AccountId

    N8nWebhookIngressFromLambda:   # optional: lets Lambdas call n8n on its private IP
      Type: AWS::EC2::SecurityGroupIngress
      Condition: HasN8nSecurityGroup
      Properties:
        GroupId: ${param:n8nSecurityGroupId}
        IpProtocol: tcp
        FromPort: 5678
        ToPort: 5678
        SourceSecurityGroupId: ${param:lambdaSecurityGroupId}

    # Attach this managed policy to the IAM user/role whose keys n8n uses for SES.
    N8nSesSendPolicy:
      Type: AWS::IAM::ManagedPolicy
      Condition: HasSesFromAddress
      Properties:
        Description: Allow sending email via SES only from the configured sender address
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: [ses:SendEmail, ses:SendRawEmail]
              Resource: "*"
              Condition:
                StringEquals:
                  ses:FromAddress: ${param:sesFromAddress}

  Outputs:
    UploadBucketName:
      Value: ${self:custom.bucketName}
    DatabaseEndpoint:
      Value: ${param:dbHost}
    N8nSesSendPolicyArn:
      Condition: HasSesFromAddress
      Value: !Ref N8nSesSendPolicy
